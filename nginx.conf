# HTTP：正式域名跳转到 HTTPS www；IP/本地仍可用 HTTP（便于健康检查）
server {
    listen 80;
    server_name www.harvey404.com harvey404.com;
    return 301 https://www.harvey404.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://server:8080/uploads/;
    }

    location /diet/ {
        proxy_pass http://172.18.51.214:80/diet/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /diet {
        return 301 /diet/;
    }

    location /diet-api/ {
        proxy_pass http://172.18.51.214:8000/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location = /diet-api {
        return 301 /diet-api/;
    }
}

# HTTPS：证书仅覆盖 www.harvey404.com
server {
    listen 443 ssl;
    server_name www.harvey404.com;

    ssl_certificate     /etc/nginx/certs/www.harvey404.com.pem;
    ssl_certificate_key /etc/nginx/certs/www.harvey404.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        proxy_pass http://server:8080/uploads/;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /diet/ {
        proxy_pass http://172.18.51.214:80/diet/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /diet {
        return 301 /diet/;
    }

    location /diet-api/ {
        proxy_pass http://172.18.51.214:8000/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location = /diet-api {
        return 301 /diet-api/;
    }
}
