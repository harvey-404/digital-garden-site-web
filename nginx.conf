server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端单页路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传文件
    location /uploads/ {
        proxy_pass http://server:8080/uploads/;
    }

    # —— 大体重减肥陪伴（同域一级目录）——
    # 上游为 ECS 私网（轻量 ↔ ECS 内网互通后可达）
    # 若 ECS 私网 IP 变更，只改下面两处 proxy_pass 主机即可
    location /diet/ {
        proxy_pass http://172.18.51.214:80/diet/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /diet {
        return 301 /diet/;
    }

    location /diet-api/ {
        proxy_pass http://172.18.51.214:8000/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    location = /diet-api {
        return 301 /diet-api/;
    }
}
